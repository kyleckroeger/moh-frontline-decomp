name: Verified progress snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verification safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Validate snapshot inputs and export objdiff v2 report
        run: python3 tools/progress_report.py
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: GMFE69_report
          path: build/progress/report.json
          if-no-files-found: error
          retention-days: 90
